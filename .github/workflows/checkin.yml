name: 自动签到
run-name: 查寝｜${{ inputs.expected_date || '手动' }}｜${{ inputs.diagnostic && '只读检查' || '自动打卡' }}
on:
  workflow_dispatch:
    inputs:
      expected_date:
        description: '本次目标日期，北京时间 YYYY-MM-DD；留空则使用当天'
        type: string
        required: false
      diagnostic:
        description: '只检查登录和当天任务，不提交签到'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: swu-checkin
  cancel-in-progress: false
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: 安装运行依赖
        run: pip install -e .
      - name: 执行打卡或只读检查
        env:
          SWUDK_USERNAME: ${{ secrets.SWU_USERNAME }}
          SWUDK_PASSWORD: ${{ secrets.SWU_PASSWORD }}
          SWUDK_EXPECTED_DATE: ${{ inputs.expected_date }}
          SWUDK_DIAGNOSTIC: ${{ inputs.diagnostic && '1' || '0' }}
          SWUDK_MAX_ATTEMPTS: '3'
          SWUDK_RETRY_DELAY: '8'
        run: python -m swu_checkin.runner
      # 不发送邮件。GitHub 的 schedule 入口已移除，由外部定时器触发。
